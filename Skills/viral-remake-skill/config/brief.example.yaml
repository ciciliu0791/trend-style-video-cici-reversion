routes: {}                      # image/video/text: ../run/preflight/<modality>-route.json
pricing: null                   # ../run/pricing.json; request-hash-bound units and rates
budget:
  cap: null
  currency: null
  authorization: null           # actual user decision/reference, never fabricated
  max_attempts_per_job: 2
